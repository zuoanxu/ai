<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>个人 AI 问答助手</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  :root { --brand: #4f46e5; }
  body { background: #f5f6fa; font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Microsoft YaHei", sans-serif; }
  .navbar-brand { font-weight: 700; }
  .card { border: none; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,.06); }
  .drop-zone { border: 2px dashed #cbd5e1; border-radius: 12px; padding: 30px; text-align: center; cursor: pointer; transition: .2s; background: #fafbfc; }
  .drop-zone:hover, .drop-zone.dragover { border-color: var(--brand); background: #eef2ff; }
  .chat-box { height: 480px; overflow-y: auto; }
  .bubble { max-width: 82%; padding: 10px 14px; border-radius: 14px; white-space: pre-wrap; word-break: break-word; font-size: .95rem; }
  .bubble.user { background: var(--brand); color: #fff; margin-left: auto; border-bottom-right-radius: 4px; }
  .bubble.ai { background: #f1f3f9; color: #1f2937; border-bottom-left-radius: 4px; }
  .cursor::after { content: "▍"; animation: blink 1s steps(1) infinite; color: var(--brand); }
  @keyframes blink { 50% { opacity: 0; } }
  .sample { cursor: pointer; }
  .sample:hover { background: #eef2ff !important; color: var(--brand) !important; }
</style>
</head>
<body>

<nav class="navbar navbar-light bg-white shadow-sm">
  <div class="container">
    <span class="navbar-brand">🤖 个人 AI 问答助手</span>
    <span class="text-muted small">RAG · Ollama</span>
  </div>
</nav>

<div class="container py-4">
  <div class="row g-4">

    <!-- 左侧：上传简历 -->
    <div class="col-lg-4">
      <div class="card h-100">
        <div class="card-body">
          <h5 class="card-title mb-1">📄 上传简历</h5>
          <p class="text-muted small mb-3">支持 PDF / Word / Excel / PPT / TXT / Markdown</p>

          <div class="drop-zone" id="dropZone">
            <div class="fs-1">📁</div>
            <div class="mt-1">点击选择文件，或拖拽到这里</div>
            <input type="file" id="fileInput" class="d-none" accept=".pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.md">
          </div>

          <div class="mt-2 small text-muted" id="fileName">未选择文件</div>
          <button class="btn btn-primary w-100 mt-3" id="uploadBtn" disabled>上传并解析</button>
          <div id="uploadResult" class="mt-3"></div>
        </div>
      </div>
    </div>

    <!-- 右侧：智能问答 -->
    <div class="col-lg-8">
      <div class="card h-100">
        <div class="card-body d-flex flex-column">
          <h5 class="card-title mb-3">💬 智能问答</h5>

          <div class="chat-box flex-grow-1" id="chatBox">
            <div id="emptyHint" class="text-center text-muted py-5">
              <div class="mb-3">上传简历后，试试问我：</div>
              <div class="d-flex flex-wrap justify-content-center gap-2">
                <span class="sample badge bg-light text-secondary border">这个人会哪些技术？</span>
                <span class="sample badge bg-light text-secondary border">他的工作经验是多久？</span>
                <span class="sample badge bg-light text-secondary border">他适合什么岗位？</span>
              </div>
            </div>
          </div>

          <div class="input-group mt-3">
            <input type="text" class="form-control" id="questionInput" placeholder="输入你的问题…" autocomplete="off">
            <button class="btn btn-primary" id="sendBtn">发送</button>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>

<script>
// 转义 HTML，防止注入（后端返回的文件名、报错都当纯文本处理）
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ============ 上传 ============
const fileInput = document.getElementById('fileInput');
const dropZone  = document.getElementById('dropZone');
const fileName  = document.getElementById('fileName');
const uploadBtn = document.getElementById('uploadBtn');
const uploadResult = document.getElementById('uploadResult');
let selectedFile = null;

dropZone.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', () => setFile(fileInput.files[0]));
['dragover', 'dragleave', 'drop'].forEach(ev =>
  dropZone.addEventListener(ev, e => {
    e.preventDefault();
    dropZone.classList.toggle('dragover', ev === 'dragover');
  })
);
dropZone.addEventListener('drop', e => setFile(e.dataTransfer.files[0]));

function setFile(f) {
  if (!f) return;
  selectedFile = f;
  fileName.textContent = f.name + '（' + (f.size / 1024).toFixed(1) + ' KB）';
  uploadBtn.disabled = false;
}

uploadBtn.addEventListener('click', async () => {
  if (!selectedFile) return;
  uploadBtn.disabled = true;
  uploadBtn.textContent = '解析中…';
  uploadResult.innerHTML = '';
  const fd = new FormData();
  fd.append('file', selectedFile);
  try {
    const r = await fetch('/assistant/upload', { method: 'POST', body: fd });
    const d = await r.json();
    uploadResult.innerHTML = d.success
      ? '<div class="alert alert-success py-2 small">✅ 上传成功，已切分 ' + d.chunks + ' 段存入向量库</div>'
      : '<div class="alert alert-danger py-2 small">❌ ' + esc(d.message) + '</div>';
  } catch (e) {
    uploadResult.innerHTML = '<div class="alert alert-danger py-2 small">上传失败：' + esc(e.message) + '</div>';
  } finally {
    uploadBtn.disabled = false;
    uploadBtn.textContent = '上传并解析';
  }
});

// ============ 问答（EventSource 流式） ============
const chatBox = document.getElementById('chatBox');
const questionInput = document.getElementById('questionInput');
const sendBtn = document.getElementById('sendBtn');

function addBubble(text, role) {
  const div = document.createElement('div');
  div.className = 'bubble ' + role + ' mb-2';
  div.textContent = text;
  chatBox.appendChild(div);
  chatBox.scrollTop = chatBox.scrollHeight;
  return div;
}

function ask() {
  const q = questionInput.value.trim();
  if (!q || sendBtn.disabled) return;
  document.getElementById('emptyHint')?.remove();
  addBubble(q, 'user');
  questionInput.value = '';

  const bubble = addBubble('', 'ai');
  bubble.classList.add('cursor');
  sendBtn.disabled = true;

  const es = new EventSource('/assistant/ask/stream?question=' + encodeURIComponent(q));
  let full = '';
  es.onmessage = (e) => {
    full += e.data;
    bubble.textContent = full;
    chatBox.scrollTop = chatBox.scrollHeight;
  };
  es.onerror = () => {
    es.close();                      // 流结束（或出错），关闭并停止自动重连
    bubble.classList.remove('cursor');
    if (!full) bubble.textContent = '（未收到回答，请确认 Ollama 已启动）';
    sendBtn.disabled = false;
  };
}

sendBtn.addEventListener('click', ask);
questionInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); ask(); }
});
document.querySelectorAll('.sample').forEach(s =>
  s.addEventListener('click', () => { questionInput.value = s.textContent.trim(); ask(); })
);
</script>
</body>
</html>
