# 用 docker compose 一键起一个带 pgvector 扩展的 PostgreSQL
# 用法：docker compose up -d
services:
  postgres:
    image: pgvector/pgvector:pg16   # 官方镜像，已内置 pgvector 扩展
    container_name: pgvector
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"                 # 和 application.yml 里的 localhost:5432 对应
    volumes:
      - pgdata:/var/lib/postgresql/data   # 数据持久化，容器删了数据还在

volumes:
  pgdata:
